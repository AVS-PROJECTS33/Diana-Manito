    <script>
        // Generador automático de Icono PNG Nativo para iPhone (Apple Touch Icon)
        // Se ejecuta instantáneamente para que iOS detecte el icono de la diana sin necesitar archivos externos.
        (function() {
            const canvas = document.createElement('canvas');
            canvas.width = 192;
            canvas.height = 192;
            const ctx = canvas.getContext('2d');
            
            // Fondo oscuro del icono
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, 192, 192);
            
            // Base oscura de la diana
            ctx.beginPath();
            ctx.arc(96, 96, 80, 0, 2 * Math.PI);
            ctx.fillStyle = '#0f172a';
            ctx.fill();
            
            // Dibuja aros intercalados Fucsia y Cyan
            function drawRing(r, width, color1, color2) {
                ctx.lineWidth = width;
                const segments = 10;
                const angle = (2 * Math.PI) / segments;
                for(let i=0; i<segments; i++) {
                    ctx.beginPath();
                    ctx.arc(96, 96, r, i*angle - (angle/2), (i+1)*angle - (angle/2));
                    ctx.strokeStyle = i % 2 === 0 ? color1 : color2;
                    ctx.stroke();
                }
            }
            
            // Líneas negras divisorias de los números
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#020617';
            const segments = 10;
            const angle = (2 * Math.PI) / segments;
            for(let i=0; i<segments; i++) {
                ctx.beginPath();
                ctx.moveTo(96, 96);
                ctx.lineTo(96 + 80 * Math.cos(i*angle - (angle/2)), 96 + 80 * Math.sin(i*angle - (angle/2)));
                ctx.stroke();
            }
            
            // Dibuja Anillo de Dobles y Triples
            drawRing(76, 8, '#06b6d4', '#ec4899');
            drawRing(40, 8, '#06b6d4', '#ec4899');
            
            // Dibuja el Centro (Bull)
            ctx.beginPath(); ctx.arc(96, 96, 14, 0, 2*Math.PI); ctx.fillStyle = '#06b6d4'; ctx.fill();
            ctx.beginPath(); ctx.arc(96, 96, 7, 0, 2*Math.PI); ctx.fillStyle = '#ec4899'; ctx.fill();
            
            // Genera la imagen en Base64
            const dataUrl = canvas.toDataURL('image/png');
            
            // Lo inyecta como icono general
            const linkIcon = document.createElement('link');
            linkIcon.rel = 'icon'; linkIcon.type = 'image/png'; linkIcon.href = dataUrl;
            document.head.appendChild(linkIcon);
            
            // Lo inyecta como Apple Touch Icon (El que lee el iPhone)
            const linkApple = document.createElement('link');
            linkApple.rel = 'apple-touch-icon'; linkApple.href = dataUrl;
            document.head.appendChild(linkApple);
        })();
    </script>

        // --- MATEMÁTICAS DIANA ---
        const polarToCartesian = (cx, cy, r, angleInDegrees) => {
            const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
            return { x: cx + r * Math.cos(angleInRadians), y: cy + r * Math.sin(angleInRadians) };
        };

        const describeArc = (x, y, innerRadius, outerRadius, startAngle, endAngle) => {
            const startOuter = polarToCartesian(x, y, outerRadius, endAngle);
            const endOuter = polarToCartesian(x, y, outerRadius, startAngle);
            const startInner = polarToCartesian(x, y, innerRadius, endAngle);
            const endInner = polarToCartesian(x, y, innerRadius, startAngle);
            const largeArcFlag = endAngle - startAngle <= 180 ? '0' : '1';
            return ['M', startOuter.x, startOuter.y, 'A', outerRadius, outerRadius, 0, largeArcFlag, 0, endOuter.x, endOuter.y, 'L', endInner.x, endInner.y, 'A', innerRadius, innerRadius, 0, largeArcFlag, 1, startInner.x, startInner.y, 'Z'].join(' ');
        };

        // --- LÓGICA DE SUGERENCIAS (CHECKOUT) ---
        const getCheckoutSuggestion = (score, dartsLeft) => {
            if (score <= 0 || dartsLeft <= 0) return null;
            
            const shots = [];
            // Prioridad: Sencillos > Bulls > Dobles > Triples
            for (let i=20; i>=1; i--) shots.push({text: `${i}`, val: i});
            shots.push({text: '25', val: 25});
            for (let i=20; i>=1; i--) shots.push({text: `D${i}`, val: i*2});
            shots.push({text: '50', val: 50});
            for (let i=20; i>=1; i--) shots.push({text: `T${i}`, val: i*3});
            
            const uniqueShots = [];
            const seen = new Set();
            for (const s of shots) {
                if (!seen.has(s.val)) {
                    seen.add(s.val);
                    uniqueShots.push(s);
                }
            }
            uniqueShots.sort((a, b) => b.val - a.val); // Ordena de mayor a menor

            const findPath = (target, depth) => {
                if (depth === 0) return target === 0 ? [] : null;
                for (const opt of uniqueShots) {
                    if (target - opt.val >= 0) {
                        const sub = findPath(target - opt.val, depth - 1);
                        if (sub !== null) return [opt.text, ...sub];
                    }
                }
                return null;
            };

            for (let depth = 1; depth <= dartsLeft; depth++) {
                const result = findPath(score, depth);
                if (result) return result;
            }
            return null;
        };

                    const sanitizedName = p.name.replace(/[^a-zA-Z0-9]/g, '_').toUpperCase();
                    const playerRef = typeof __firebase_config !== 'undefined'
                        ? window.fb.doc(firebaseDb, 'artifacts', canvasAppId, 'public', 'data', 'rankings', sanitizedName)
                        : window.fb.doc(firebaseDb, 'rankings', sanitizedName);

                    try {
                        const snap = await window.fb.getDoc(playerRef);
                        let data = snap.exists() ? snap.data() : { name: p.name, stats: {} };
                        
                        if (!data.stats[mode]) data.stats[mode] = { bestScore: 0, wins: 0, games: 0 };
                        
                        if (data.stats[mode].bestScore === undefined) {
                            if (data.stats[mode].darts > 0) {
                                data.stats[mode].bestScore = isCricketMode 
                                    ? (data.stats[mode].marks / data.stats[mode].darts) * 3 
                                    : (mode === 'high_score' ? data.stats[mode].points : (data.stats[mode].points / data.stats[mode].darts));
                            } else {
                                data.stats[mode].bestScore = 0;
                            }
                        }

                        if (matchScore > data.stats[mode].bestScore) {
                            data.stats[mode].bestScore = matchScore;
                        }
                        
                        data.stats[mode].games += 1;
                        if (winPlayer && winPlayer.id === p.id) data.stats[mode].wins += 1;

                        await window.fb.setDoc(playerRef, data);
                    } catch(e) { console.error("Error guardando stats:", e) }
                }
            };

            const updateGame = (updates) => {
                setGameState(prev => {
                    const next = { ...prev, ...updates };
                    if (isOnline && roomId && firebaseDb && user) {
                        const canvasAppId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                        const roomRef = typeof __firebase_config !== 'undefined'
                            ? window.fb.doc(firebaseDb, 'artifacts', canvasAppId, 'public', 'data', 'rooms', roomId)
                            : window.fb.doc(firebaseDb, 'rooms', roomId);
                        
                        window.fb.setDoc(roomRef, next, { merge: true }).catch(e => console.error(e));
                    }
                    return next;
                });
            };

            const getDynamicGridClass = (totalItems) => {
                if (totalItems === 1) return 'grid-cols-1 grid-rows-1';
                if (totalItems === 2) return 'grid-cols-2 grid-rows-1';
                if (totalItems === 3) return 'grid-cols-3 grid-rows-1';
                if (totalItems === 4) return 'grid-cols-2 grid-rows-2';
                if (totalItems === 5 || totalItems === 6) return 'grid-cols-3 grid-rows-2';
                if (totalItems === 7 || totalItems === 8) return 'grid-cols-4 grid-rows-2';
                return 'grid-cols-4 grid-rows-2'; 
            };

            const generateSafeQRUrl = () => {
                const baseUrl = window.location.href.split('?')[0];
                return `${baseUrl}?room=${roomId}`;
            };

            const { appState, gameMode, numPlayers, players, activeTab, currentPlayerIdx, currentTurnThrows, lastHit, winner, round, isBust, pendingConfirmation, isNewRecord, recordStatsText } = gameState;

            // Función anti-trampa para comprobar si el jugador acaba de conseguir el objetivo exacto en este mismo turno
            const checkTentativeWin = (throws = currentTurnThrows) => {
                if (!players[currentPlayerIdx]) return false;
                const currentPoints = throws.reduce((sum, t) => sum + t.points, 0);
                if (['301', '501', '701', '901'].includes(gameMode)) {
                    return players[currentPlayerIdx].previousRoundScore - currentPoints === 0;
                }
                if (gameMode === 'perdiz') {
                    return players[currentPlayerIdx].previousRoundScore + currentPoints === 696;
                }
                if (gameMode === 'around_the_clock') {
                    let target = players[currentPlayerIdx].score;
                    throws.forEach(t => { if (t.sector === target) target++; });
                    return target > 20;
                }
                return false;
            };

            const handleCreateRoom = () => {
                const id = Math.random().toString(36).substring(2, 6).toUpperCase();
                setRoomId(id);
                setIsOnline(true);
                updateGame({ appState: 'setup_config' });
            };

            const handleGoToNames = () => {
                setTempNames(Array(numPlayers).fill(''));
                updateGame({ appState: 'setup_names' });
            };

            const initPlayers = () => {
                const initialScore = ['301', '501', '701', '901'].includes(gameMode) ? parseInt(gameMode) : 
                                     (gameMode === 'around_the_clock' ? 1 : 0);
                
                // GUARDAR NOMBRES EN EL HISTORIAL (LOCALSTORAGE)
                const currentNamesTrimmed = tempNames.map(n => n.trim().toUpperCase()).filter(n => n);
                const newSavedNames = [...new Set([...savedNames, ...currentNamesTrimmed])];
                setSavedNames(newSavedNames);
                try { localStorage.setItem('manitos_saved_names', JSON.stringify(newSavedNames)); } catch(e) {}

                // CREAR PERFIL EN FIREBASE SI ES UN JUGADOR NUEVO
                if (firebaseDb && user) {
                    const canvasAppId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                    currentNamesTrimmed.forEach(name => {
                        const sanitizedName = name.replace(/[^a-zA-Z0-9]/g, '_').toUpperCase();
                        const playerRef = typeof __firebase_config !== 'undefined'
                            ? window.fb.doc(firebaseDb, 'artifacts', canvasAppId, 'public', 'data', 'rankings', sanitizedName)
                            : window.fb.doc(firebaseDb, 'rankings', sanitizedName);
                        
                        window.fb.getDoc(playerRef).then(snap => {
                            if (!snap.exists()) {
                                window.fb.setDoc(playerRef, { name: name, stats: {} });
                            }
                        }).catch(e => console.error("Error creando perfil:", e));
                    });
                }
                
                const newPlayers = tempNames.map((name, i) => ({
                    id: i,
                    name: name.trim() || `Jugador ${i + 1}`,
                    score: initialScore, 
                    previousRoundScore: initialScore,
                    marks: { 20: 0, 19: 0, 18: 0, 17: 0, 16: 0, 15: 0, 25: 0 },
                    matchStats: { darts: 0, points: 0, marks: 0 },
                    lastTurnThrows: [],
                    lastTurnBust: false
                }));
                
                updateGame({
                    players: newPlayers,
                    currentPlayerIdx: 0,
                    currentTurnThrows: [],
                    lastHit: null,
                    winner: null,
                    round: 1,
                    isBust: false,
                    activeTab: 'board',
                    pendingConfirmation: false,
                    isNewRecord: false,
                    recordStatsText: null,
                    turnInRound: 0,
                    lastTurnPlayerIdx: null,
                    lastTurnThrows: [],
                    lastTurnBust: false,
                    history: [],
                    appState: (isOnline && !isAdminOnlyMode) ? 'setup_qr' : 'playing'
                });
                setShowExitConfirm(false);
            };

            const isActionAllowed = () => {
                if (!joinedViaUrl) return true; 
                if (isAdminRemote) return true;
                return localPlayerId === currentPlayerIdx; 
            };

            // Función auxiliar para mostrar el Toast visual en el tablero
            const showToast = (text, multiplier) => {
                let colorClass = 'text-cyan-400 border-cyan-500/50 shadow-[0_0_15px_rgba(6,182,212,0.4)]'; 
                if (multiplier === 2) colorClass = 'text-fuchsia-400 border-fuchsia-500/50 shadow-[0_0_15px_rgba(236,72,153,0.4)]'; 
                if (multiplier === 3) colorClass = 'text-yellow-400 border-yellow-500/50 shadow-[0_0_15px_rgba(234,179,8,0.4)]'; 
                if (text === 'Fallo (Fuera)') colorClass = 'text-red-400 border-red-500/50 shadow-[0_0_15px_rgba(239,68,68,0.4)]';
                if (text.includes('No entiendo')) colorClass = 'text-amber-400 border-amber-500/50 shadow-[0_0_15px_rgba(245,158,11,0.4)]';

                setShowTargetToast({ text, colorClass, id: Date.now() });

                if (toastTimeoutRef.current) {
                    clearTimeout(toastTimeoutRef.current);
                }
                
                toastTimeoutRef.current = setTimeout(() => {
                    setShowTargetToast(null);
                }, 1800);
            };
            
            // --- RECONOCIMIENTO DE VOZ CONTINUO ---
            const processVoiceCommandRef = useRef(null);

            // Mantiene siempre acceso a las últimas funciones de la partida sin perder contexto
            useEffect(() => {
                processVoiceCommandRef.current = (transcript) => {
                    let text = transcript.toLowerCase().trim();
                    let sector = null;
                    let mult = 1;

                    if (text.includes("fall") || text.includes("fuer") || text.includes("cero") || text.includes("nada")) {
                        handleMiss(); return;
                    }
                    if (text.includes("doble bull") || text.includes("doble centro") || text.includes("cincuenta") || text.includes("50")) {
                        handleHit(25, 2); return;
                    }
                    if (text.includes("bull") || text.includes("centro") || text.includes("veinticinco") || text.includes("25") || text.includes("diana")) {
                        handleHit(25, 1); return;
                    }

                    if (text.includes("doble")) mult = 2;
                    else if (text.includes("triple")) mult = 3;

                    const numbersMap = {"uno":1,"dos":2,"tres":3,"cuatro":4,"cinco":5,"seis":6,"siete":7,"ocho":8,"nueve":9,"diez":10,"once":11,"doce":12,"trece":13,"catorce":14,"quince":15,"dieciséis":16,"diecisiete":17,"dieciocho":18,"diecinueve":19,"veinte":20};
                    const match = text.match(/\d+/);
                    if (match) {
                        const num = parseInt(match[0]);
                        if (num >= 1 && num <= 20) sector = num;
                    } else {
                        for (const [word, val] of Object.entries(numbersMap)) {
                            if (text.includes(word)) { sector = val; break; }
                        }
                    }

                    if (sector !== null) handleHit(sector, mult);
                    else showToast(`No entiendo: "${transcript}"`, 0);
                };
            });

            // Auto-stop del micrófono cuando el turno termina
            const toggleListening = () => {
                if (isListening) {
                    recognitionRef.current?.stop();
                    setIsListening(false);
                    return;
                }

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("Tu navegador no soporta el reconocimiento de voz (Usa Chrome o Edge actualizados).");
                    return;
                }

                try {
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'es-ES';
                    recognition.continuous = true;
                    recognition.interimResults = false;

                    recognition.onresult = (event) => {
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) {
                                const transcript = event.results[i][0].transcript;
                                if (processVoiceCommandRef.current) {
                                    processVoiceCommandRef.current(transcript);
                                }
                            }
                        }
                    };

                    recognition.onend = () => setIsListening(false);
                    recognition.onerror = () => setIsListening(false);

                    recognition.start();
                    setIsListening(true);
                    recognitionRef.current = recognition;
                } catch (e) {
                    console.error("Fallo micro:", e);
                    setIsListening(false);
                }
            };

            useEffect(() => {
                if (isListening && (currentTurnThrows.length >= 3 || isBust || winner || pendingConfirmation)) {
                    recognitionRef.current?.stop();
                    setIsListening(false);
                }
            }, [currentTurnThrows.length, isBust, winner, pendingConfirmation, isListening]);

            // Nombres combinados para el autocompletado (Historial Local + Base de datos Firebase)
            const allKnownNames = [...new Set([
                ...savedNames,
                ...rankingsData.map(p => p.name.toUpperCase())
            ])].sort();

            // --- LÓGICA DE EDICIÓN DE PERFIL ---
            const confirmEditProfileName = async () => {
                if (!firebaseDb || !user || !selectedProfile) return;
                
                const oldSanitizedName = selectedProfile.name.replace(/[^a-zA-Z0-9]/g, '_').toUpperCase();
                const newName = editingNameValue.trim().toUpperCase();
                const newSanitizedName = newName.replace(/[^a-zA-Z0-9]/g, '_').toUpperCase();
                
                const canvasAppId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                const oldPlayerRef = typeof __firebase_config !== 'undefined' 
                    ? window.fb.doc(firebaseDb, 'artifacts', canvasAppId, 'public', 'data', 'rankings', oldSanitizedName) 
                    : window.fb.doc(firebaseDb, 'rankings', oldSanitizedName);
                
                if (oldSanitizedName === newSanitizedName) {
                    await window.fb.setDoc(oldPlayerRef, { name: newName }, { merge: true });
                    setSelectedProfile(prev => ({ ...prev, name: newName }));
                } else {
                    const newPlayerRef = typeof __firebase_config !== 'undefined' 
                        ? window.fb.doc(firebaseDb, 'artifacts', canvasAppId, 'public', 'data', 'rankings', newSanitizedName) 
                        : window.fb.doc(firebaseDb, 'rankings', newSanitizedName);
                    try {
                        const snap = await window.fb.getDoc(newPlayerRef);
                        if (snap.exists()) {
                            alert("Ya existe un perfil con ese nombre. Por favor, elige otro.");
                            setShowEditNameConfirm(false);
                            return;
                        }
                        const oldSnap = await window.fb.getDoc(oldPlayerRef);
                        if (oldSnap.exists()) {
                            const data = oldSnap.data();
                            data.name = newName;
                            await window.fb.setDoc(newPlayerRef, data);
                            if (window.fb.deleteDoc) await window.fb.deleteDoc(oldPlayerRef);
                            setSelectedProfile(data);
                        }
                    } catch(e) { console.error("Error cambiando nombre", e); }
                }
                
                setShowEditNameConfirm(false);
                setIsEditingName(false);
            };

            const handleHit = (sector, multiplier) => {
                if (!isActionAllowed()) return false;
                if (currentTurnThrows.length >= 3 || winner || isBust || pendingConfirmation || checkTentativeWin()) return false;
                
                const isCricket = ['cut_throat', 'normal_cricket', 'no_score_cricket'].includes(gameMode);
                if (isCricket && !CRICKET_NUMBERS.includes(sector)) {
                    handleMiss();
                    return true;
                }

                let points = sector * multiplier;
                if (sector === 25) points = multiplier === 1 ? 25 : 50;

                let text = getSectorText(sector, multiplier);
                
                showToast(text, multiplier);
                
                let stolen = false;
                if (gameMode === 'perdiz' && gameState.lastTurnPlayerIdx !== null && gameState.lastTurnPlayerIdx !== currentPlayerIdx && !gameState.lastTurnBust) {
                    const prevThrows = gameState.lastTurnThrows || [];
                    if (sector !== 0 && prevThrows.some(t => t.sector === sector && t.multiplier === multiplier)) {
                        stolen = true;
                    }
                }

                const throwData = { sector, multiplier, points, text, stolen };
                const newThrows = [...currentTurnThrows, throwData];
                
                let newIsBust = isBust;

                // Calculamos solo el Bust a mitad de turno. La victoria se consolida en endTurn.
                if (['301', '501', '701', '901'].includes(gameMode)) {
                    const currentPointsScored = newThrows.reduce((sum, t) => sum + t.points, 0);
                    const remaining = players[currentPlayerIdx].previousRoundScore - currentPointsScored;

                    if (remaining < 0) { 
                        newIsBust = true;
                    }
                } else if (gameMode === 'perdiz') {
                    const currentPointsScored = newThrows.reduce((sum, t) => sum + t.points, 0);
                    const total = players[currentPlayerIdx].previousRoundScore + currentPointsScored;
                    if (total > 696) {
                        newIsBust = true;
                    }
                }

                updateGame({
                    currentTurnThrows: newThrows,
                    lastHit: throwData,
                    isBust: newIsBust
                });

                return true; 
            };

            const handleMiss = () => {
                if (!isActionAllowed()) return false;
                if (currentTurnThrows.length >= 3 || winner || isBust || pendingConfirmation || checkTentativeWin()) return false;
                const throwData = { sector: 0, multiplier: 0, points: 0, text: `Fallo (Fuera)` };
                
                showToast(throwData.text, 0);

                updateGame({
                    currentTurnThrows: [...currentTurnThrows, throwData],
                    lastHit: throwData
                });
                return true;
            };

            const undoAction = () => {
                if (!isActionAllowed()) return;
                if (currentTurnThrows.length > 0 && !winner && !pendingConfirmation) {
                    const newThrows = [...currentTurnThrows];
                    newThrows.pop();
                    updateGame({
                        currentTurnThrows: newThrows,
                        lastHit: newThrows.length > 0 ? newThrows[newThrows.length - 1] : null,
                        isBust: false
                    });
                    setShowTargetToast(null);
                } else if (currentTurnThrows.length === 0 && !pendingConfirmation) {
                    const hist = gameState.history || [];
                    if (hist.length > 0) {
                        setShowUndoConfirm(true);
                    }
                }
            };

            const confirmUndoTurn = () => {
                const hist = gameState.history || [];
                if (hist.length > 0) {
                    const lastState = hist[hist.length - 1];
                    const newHistory = hist.slice(0, -1);
                    updateGame({
                        players: lastState.players,
                        currentPlayerIdx: lastState.currentPlayerIdx,
                        round: lastState.round,
                        turnInRound: lastState.turnInRound,
                        lastTurnPlayerIdx: lastState.lastTurnPlayerIdx,
                        lastTurnThrows: lastState.lastTurnThrows,
                        lastTurnBust: lastState.lastTurnBust,
                        isNewRecord: lastState.isNewRecord,
                        recordStatsText: lastState.recordStatsText,
                        winner: lastState.winner,
                        history: newHistory,
                        currentTurnThrows: [],
                        lastHit: null,
                        isBust: false,
                        pendingConfirmation: false,
                        activeTab: 'board'
                    });
                    setShowTargetToast(null);
                }
                setShowUndoConfirm(false);
            };

            const requestTurnConfirmation = () => {
                if (!isActionAllowed()) return;
                if (currentTurnThrows.length < 3 && !isBust && !checkTentativeWin()) return;

                if (isOnline && joinedViaUrl) {
                    updateGame({ pendingConfirmation: true });
                } else {
                    endTurn(); 
                }
            };

            const checkWinnerCricket = (currentPlayers, mode) => {
                for (let i = 0; i < currentPlayers.length; i++) {
                    const p = currentPlayers[i];
                    let allClosed = CRICKET_NUMBERS.every(num => p.marks[num] >= 3);

                    if (allClosed) {
                        if (mode === 'no_score_cricket') return p;
                        
                        let hasWinningScore = true;
                        for (let j = 0; j < currentPlayers.length; j++) {
                            if (i !== j) {
                                if (mode === 'cut_throat' && currentPlayers[j].score < p.score) hasWinningScore = false;
                                if (mode === 'normal_cricket' && currentPlayers[j].score > p.score) hasWinningScore = false;
                            }
                        }
                        if (hasWinningScore) return p;
                    }
                }
                return null;
            };

            const endTurn = () => {
                if (currentTurnThrows.length < 3 && !isBust && !checkTentativeWin()) return;

                // GUARDAR EL ESTADO EN EL HISTORIAL ANTES DE APLICAR EL FIN DE TURNO
                const stateToSave = {
                    players: JSON.parse(JSON.stringify(players)),
                    currentPlayerIdx,
                    round,
                    turnInRound: gameState.turnInRound,
                    lastTurnPlayerIdx: gameState.lastTurnPlayerIdx,
                    lastTurnThrows: gameState.lastTurnThrows,
                    lastTurnBust: gameState.lastTurnBust,
                    isNewRecord,
                    recordStatsText,
                    winner
                };
                const newHistory = [...(gameState.history || []), stateToSave].slice(-20); // Mantiene los últimos 20 turnos para no sobrecargar el estado

                let updatedPlayers = players.map(p => ({ ...p, marks: { ...p.marks }, matchStats: { ...p.matchStats } }));
                let currentP = updatedPlayers[currentPlayerIdx];
                
                currentP.lastTurnThrows = [...currentTurnThrows]; // Clonamos el array por seguridad
                currentP.lastTurnBust = isBust;

                const isCricketMode = ['cut_throat', 'normal_cricket', 'no_score_cricket'].includes(gameMode);
                let pointsScoredThisTurn = 0;
                let marksScoredThisTurn = 0;

                currentTurnThrows.forEach(t => {
                    pointsScoredThisTurn += t.points;
                    if (isCricketMode && t.sector !== 0 && CRICKET_NUMBERS.includes(t.sector)) {
                        marksScoredThisTurn += t.multiplier;
                    }
                });

                if (isBust && ['301', '501', '701', '901', 'perdiz'].includes(gameMode)) {
                    pointsScoredThisTurn = 0;
                }

                currentP.matchStats.darts += currentTurnThrows.length;
                currentP.matchStats.points += pointsScoredThisTurn;
                currentP.matchStats.marks += marksScoredThisTurn;

                if (['301', '501', '701', '901'].includes(gameMode)) {
                    if (isBust) {
                        currentP.score = currentP.previousRoundScore;
                    } else {
                        currentP.score = currentP.previousRoundScore - pointsScoredThisTurn;
                        currentP.previousRoundScore = currentP.score;
                    }
                } 
                else if (gameMode === 'high_score') {
                    currentP.score += pointsScoredThisTurn;
                }
                else if (gameMode === 'perdiz') {
                    const stolenPoints = currentTurnThrows.filter(t => t.stolen).reduce((sum, t) => sum + t.points, 0);
                    if (isBust) {
                        currentP.score = currentP.previousRoundScore;
                    } else {
                        currentP.score = currentP.previousRoundScore + pointsScoredThisTurn;
                        currentP.previousRoundScore = currentP.score;
                        if (gameState.lastTurnPlayerIdx !== null) {
                            updatedPlayers[gameState.lastTurnPlayerIdx].score = Math.max(0, updatedPlayers[gameState.lastTurnPlayerIdx].score - stolenPoints);
                            updatedPlayers[gameState.lastTurnPlayerIdx].previousRoundScore = updatedPlayers[gameState.lastTurnPlayerIdx].score;
                        }
                    }
                }
                else if (gameMode === 'around_the_clock') {
                    currentTurnThrows.forEach(t => {
                        if (t.sector === currentP.score) currentP.score += 1;
                    });
                }
                else {
                    const isCutThroat = gameMode === 'cut_throat';
                    const isNoScore = gameMode === 'no_score_cricket';
                    
                    currentTurnThrows.forEach(t => {
                        const s = t.sector;
                        if (s !== 0 && currentP.marks[s] !== undefined) {
                            let marksNeededToClose = 3 - currentP.marks[s];
                            let marksScored = t.multiplier;

                            if (marksNeededToClose > 0) {
                                if (marksScored <= marksNeededToClose) {
                                    currentP.marks[s] += marksScored;
                                    marksScored = 0;
                                } else {
                                    currentP.marks[s] = 3;
                                    marksScored -= marksNeededToClose;
                                }
                            }

                            if (marksScored > 0 && !isNoScore) {
                                const pointsToDistribute = s * marksScored;
                                if (isCutThroat) {
                                    updatedPlayers.forEach((otherP, idx) => {
                                        if (idx !== currentPlayerIdx && otherP.marks[s] < 3) {
                                            otherP.score += pointsToDistribute;
                                        }
                                    });
                                } else { 
                                    const anyRivalOpen = updatedPlayers.some((otherP, idx) => idx !== currentPlayerIdx && otherP.marks[s] < 3);
                                    if (anyRivalOpen) {
                                        currentP.score += pointsToDistribute;
                                    }
                                }
                            }
                        }
                    });
                }

                // Determinamos el ganador aquí, DESPUÉS de confirmar la tirada.
                let possibleWinner = null;
                if (['cut_throat', 'normal_cricket', 'no_score_cricket'].includes(gameMode)) {
                    possibleWinner = checkWinnerCricket(updatedPlayers, gameMode);
                } else if (gameMode === 'high_score') {
                    if (currentPlayerIdx === players.length - 1 && round === 7) {
                        possibleWinner = [...updatedPlayers].sort((a, b) => b.score - a.score)[0];
                    }
                } else if (['301', '501', '701', '901'].includes(gameMode)) {
                    if (currentP.score === 0) possibleWinner = currentP;
                } else if (gameMode === 'perdiz') {
                    if (currentP.score === 696) possibleWinner = currentP;
                } else if (gameMode === 'around_the_clock') {
                    if (currentP.score > 20) possibleWinner = currentP;
                }

                let nextTurnInRound = (gameState.turnInRound || 0);
                let nextPlayerIdx = currentPlayerIdx;
                let nextRound = round;

                if (!possibleWinner && !winner) {
                    if (gameMode === 'perdiz') {
                        nextTurnInRound++;
                        if (nextTurnInRound >= players.length) {
                            nextTurnInRound = 0;
                            nextRound++;
                        }
                        let roundStarter = (nextRound - 1) % players.length;
                        nextPlayerIdx = (roundStarter + nextTurnInRound) % players.length;
                    } else {
                        if (currentPlayerIdx === players.length - 1) nextRound++;
                        nextPlayerIdx = (currentPlayerIdx + 1) % players.length;
                    }
                }

                let newIsRecord = isNewRecord;
                let newRecordText = recordStatsText;

                // Guarda datos globales si la tablet anfitriona procesa el fin de juego
                if (possibleWinner && !joinedViaUrl) {
                    const isX01 = ['301', '501', '701', '901'].includes(gameMode);
                    
                    if (isCricketMode || isX01 || gameMode === 'high_score') {
                        let matchScore = 0;
                        const pStats = possibleWinner.matchStats;
                        if (gameMode === 'high_score') {
                            matchScore = possibleWinner.score;
                        } else if (pStats.darts > 0) {
                            matchScore = isCricketMode ? ((pStats.marks / pStats.darts) * 3) : (pStats.points / pStats.darts);
                        }

                        let globalBest = 0;
                        rankingsData.forEach(p => {
                            if (p.stats && p.stats[gameMode]) {
                                const s = p.stats[gameMode];

                                                <div className="flex-1 min-w-0">
                                                    <span className="text-slate-300 text-[8px] md:text-xs uppercase font-bold tracking-widest block mb-0 md:mb-1 drop-shadow-md">
                                                        Turno de {gameMode === 'high_score' && <span className="text-fuchsia-400">- R{round}/7</span>}
                                                    </span>
                                                    <h3 className="text-base md:text-3xl font-black text-cyan-400 truncate leading-tight drop-shadow-[0_0_10px_rgba(6,182,212,0.5)]">{currentPlayer.name}</h3>
                                                    <div className="flex flex-wrap items-center gap-1 md:gap-2 mt-0.5 md:mt-1">
                                                        <div className="inline-flex items-center gap-1 md:gap-1.5 bg-slate-950/50 px-2 py-0.5 rounded-md border border-slate-700/50 truncate max-w-full">
                                                            <span className="text-[8px] md:text-[10px] text-slate-500 uppercase font-black tracking-widest shrink-0">{gameState.lastTurnPlayerIdx !== null && players[gameState.lastTurnPlayerIdx] ? `Ant (${players[gameState.lastTurnPlayerIdx].name.substring(0, 3)}):` : 'Ant:'}</span>
                                                            <span className="text-[9px] md:text-xs text-slate-300 font-bold truncate">
                                                                {gameState.lastTurnThrows && gameState.lastTurnThrows.length > 0 ? (
                                                                    gameState.lastTurnBust ? <span className="text-red-400 animate-pulse">BUST</span> : gameState.lastTurnThrows.map(t => t.text).join(' · ')
                                                                ) : (
                                                                    <span className="text-slate-600">-</span>
                                                                )}
                                                            </span>
                                                        </div>
                                                        {['301', '501', '701', '901'].includes(gameMode) && getLiveScore(currentPlayer, currentPlayerIdx) <= 180 && getLiveScore(currentPlayer, currentPlayerIdx) > 0 && currentTurnThrows.length < 3 && !isBust && (
                                                            <div className="inline-flex items-center gap-1 md:gap-1.5 bg-cyan-950/50 px-2 py-0.5 rounded-md border border-cyan-700/50 truncate max-w-full animate-toast">
                                                                <span className="text-[8px] md:text-[10px] text-cyan-500 uppercase font-black tracking-widest shrink-0">Cierre:</span>
                                                                <span className="text-[9px] md:text-xs text-cyan-300 font-bold truncate">
                                                                    {getCheckoutSuggestion(getLiveScore(currentPlayer, currentPlayerIdx), 3 - currentTurnThrows.length)?.join(' · ') || 'Sin cierre'}
                                                                </span>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                                <div className="flex gap-1 md:gap-2 shrink-0 ml-1 md:ml-2">
                                                    {[0, 1, 2].map(i => {
                                                        const t = currentTurnThrows[i];
                                                        const isThrown = i < currentTurnThrows.length;
                                                        
                                                        let shortText = '';
                                                        if (isThrown) {
                                                            if (t.sector === 0) shortText = '0';
                                                            else if (t.sector === 25) shortText = t.multiplier === 1 ? '25' : '50';
                                                            else shortText = (t.multiplier === 3 ? 'T' : (t.multiplier === 2 ? 'D' : '')) + t.sector;
                                                        }

                                                        return (
                                                            <div key={i} className={`w-12 h-12 md:w-20 md:h-20 rounded-xl md:rounded-2xl flex items-center justify-center border-[3px] md:border-4 transition-all ${isThrown ? (isBust ? 'border-red-500 bg-slate-950 shadow-[0_0_15px_rgba(239,68,68,0.5)]' : (t.stolen ? 'border-amber-500 bg-slate-950 shadow-[0_0_15px_rgba(245,158,11,0.5)]' : 'border-fuchsia-500 bg-slate-950 shadow-[0_0_15px_rgba(236,72,153,0.5)]')) : 'border-slate-700/50 bg-slate-800/30'}`}>
                                                                {isThrown ? <span className={`font-black text-base md:text-3xl ${isBust ? 'text-red-400' : (t.stolen ? 'text-amber-400' : 'text-fuchsia-400')}`}>{shortText}</span> : <IconDart size={24} className="text-slate-500 md:scale-125" />}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>

                                            <div className="flex flex-col gap-1.5 md:gap-2">
                                                <div className="flex gap-1.5 md:gap-2 h-7 md:h-14">
                                                    <div className={`flex-[2] bg-slate-950/60 border ${isBust ? 'border-red-500/50' : 'border-slate-700/50'} rounded-lg md:rounded-xl p-1 flex items-center justify-center relative overflow-hidden h-full`}>
                                                        {isBust ? <span className="text-[10px] md:text-lg font-black text-red-500 animate-pulse text-center leading-none drop-shadow-md">BUST</span>
                                                                : lastHit ? <span className="text-[10px] md:text-xl font-black text-white text-center leading-none drop-shadow-md">{lastHit.text}</span>
                                                                          : <span className="text-slate-400 font-bold text-[9px] md:text-xs">Toca la diana</span>}
                                                    </div>
                                                    <button onClick={handleMiss} disabled={!isActionAllowed() || isTurnComplete || winner || pendingConfirmation} className="flex-1 rounded-lg md:rounded-xl bg-red-900/40 text-red-400 border border-red-900/50 font-bold text-[9px] md:text-sm flex items-center justify-center disabled:opacity-30 active:bg-red-900/60 h-full backdrop-blur-sm">
                                                        Fallo
                                                    </button>
                                                </div>
                                                <div className="flex gap-1.5 md:gap-2 h-8 md:h-16">
                                                    <button onClick={undoAction} disabled={!isActionAllowed() || (currentTurnThrows.length === 0 && !(gameState.history && gameState.history.length > 0)) || winner || pendingConfirmation} className="flex-1 rounded-lg md:rounded-xl bg-slate-800/60 text-slate-200 font-bold text-[9px] md:text-sm flex flex-col md:flex-row gap-1 items-center justify-center disabled:opacity-30 active:bg-slate-700/80 h-full backdrop-blur-sm border border-slate-600/30">
                                                        <IconUndo size={14} /> <span className="hidden lg:inline">{currentTurnThrows.length === 0 ? "Deshacer Turno" : "Deshacer"}</span>
                                                    </button>
                                                    
                                                    <button onClick={requestTurnConfirmation} disabled={!isActionAllowed() || (!isTurnComplete && !winner) || pendingConfirmation} className={`flex-[2] rounded-lg md:rounded-xl font-black text-[10px] md:text-lg flex items-center justify-center gap-1 md:gap-2 transition-all h-full ${isTurnComplete && !winner ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white animate-pulse shadow-[0_0_15px_rgba(6,182,212,0.5)]' : 'bg-slate-800/50 text-slate-500 opacity-50 border border-slate-700/50'}`}>
                                                        ENVIAR TURNO <IconArrowRight size={14} />
                                                    </button>

                                                    <button onClick={toggleListening} disabled={!isActionAllowed() || isTurnComplete || winner || pendingConfirmation} className={`flex-1 rounded-lg md:rounded-xl font-black text-[9px] md:text-sm flex flex-col md:flex-row gap-1 items-center justify-center transition-all h-full backdrop-blur-sm border disabled:opacity-30 ${isListening ? 'bg-red-900/40 text-red-400 border-red-500/80 animate-pulse shadow-[0_0_15px_rgba(239,68,68,0.4)]' : 'bg-slate-800/60 text-fuchsia-400 border-fuchsia-500/50 hover:bg-slate-700/80 shadow-[0_0_15px_rgba(236,72,153,0.3)]'}`}>
                                                        <IconMic size={14} /> <span className="hidden lg:inline">{isListening ? 'Escuchando' : 'Dictar'}</span>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                        <div className={`${joinedViaUrl ? 'hidden md:flex' : 'flex-1'} bg-slate-900/80 backdrop-blur-md border border-slate-700/50 rounded-2xl overflow-hidden flex flex-col min-h-0 shadow-[0_0_20px_rgba(0,0,0,0.4)]`}>
                                            <div className="bg-slate-950/60 px-3 py-1.5 border-b border-slate-700/50 flex justify-between items-center shrink-0">
                                                <span className="text-[10px] md:text-xs font-bold text-slate-300 uppercase tracking-widest drop-shadow-md">En vivo</span>
                                                <span className="text-[9px] md:text-[10px] font-bold text-fuchsia-400 bg-fuchsia-900/40 px-2 rounded-full border border-fuchsia-500/30 drop-shadow-md truncate max-w-[120px]">
                                                    {GAME_MODES[gameMode].name}
                                                </span>
                                            </div>
                                            <div className="flex-1 min-h-0 overflow-hidden p-0.5">
                                                {isCricket ? (
                                                    <table className="w-full h-full text-center border-collapse table-fixed">
                                                        <thead>
                                                            <tr className="h-[12%]">
                                                                <th className="border-b border-slate-700/50 text-slate-400 w-8 md:w-12 text-[9px] md:text-[10px] uppercase">Nº</th>
                                                                {players.map((p, i) => <th key={p.id} className={`border-b border-slate-700/50 truncate text-xs md:text-sm font-black ${i === currentPlayerIdx ? 'text-cyan-400 bg-cyan-900/30' : 'text-slate-200'}`}>{p.name.substring(0,4)}</th>)}
                                                            </tr>
                                                        </thead>
                                                        <tbody className="h-[88%]">
                                                            {!isNoScore && (
                                                                <tr className="bg-slate-950/60 border-b border-cyan-800/50 h-[11%]">
                                                                    <td className="border-r border-slate-700/50 text-fuchsia-400 font-bold text-[9px] md:text-[10px] uppercase drop-shadow-sm">PTS</td>
                                                                    {players.map((p, i) => <td key={`mini-pts-${p.id}`} className={`border-slate-700/50 font-black text-white text-xs md:text-sm drop-shadow-md ${i === currentPlayerIdx ? 'bg-cyan-900/20' : ''}`}>{p.score}</td>)}
                                                                </tr>
                                                            )}
                                                            {CRICKET_NUMBERS.map(num => (
                                                                <tr key={num} className="h-[11%]">
                                                                    <td className="border-t border-r border-slate-700/50 text-slate-200 font-black text-xs md:text-sm bg-slate-950/30">{num === 25 ? 'B' : num}</td>
                                                                    {players.map((p, i) => <td key={`mini-${p.id}-${num}`} className={`border-t border-slate-700/50 relative ${i === currentPlayerIdx ? 'bg-cyan-900/20' : ''}`}>{renderCricketMark(p.marks[num], true)}</td>)}
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                ) : (
                                                    <div className={`grid gap-1.5 w-full h-full ${getDynamicGridClass(players.length)} p-1`}>
                                                        {players.map((p, i) => (
                                                            <div key={p.id} className={`bg-slate-950/60 rounded-lg p-1 border flex flex-col items-center justify-center min-h-0 ${i === currentPlayerIdx ? 'border-cyan-500/80 bg-cyan-900/30' : 'border-slate-700/50'}`}>
                                                                <span className={`text-[10px] md:text-sm font-bold uppercase tracking-widest truncate w-full text-center shrink-0 drop-shadow-sm ${i === currentPlayerIdx ? 'text-cyan-400' : 'text-slate-400'}`}>{p.name}</span>
                                                                {gameMode === 'around_the_clock' && i === currentPlayerIdx ? (
                                                                    <span className="text-[8px] text-fuchsia-400 uppercase tracking-widest mb-[-4px]">Objetivo</span>
                                                                ) : null}
                                                                <span className={`text-xl md:text-3xl lg:text-4xl font-black min-h-0 drop-shadow-md ${i === currentPlayerIdx ? (gameMode === 'around_the_clock' ? 'text-fuchsia-400 animate-pulse' : 'text-white') : 'text-slate-300'}`}>{getLiveScore(p, i)}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            )}

                            {activeTab === 'scores' && (
                                <div className="flex-1 flex flex-col bg-slate-900/80 backdrop-blur-md border border-slate-700/50 rounded-3xl overflow-hidden shadow-[0_0_30px_rgba(0,0,0,0.5)] min-h-0">
                                    {!isCricket && gameMode !== 'around_the_clock' && (
                                        <div className="p-2 md:p-3 bg-slate-950/80 border-b border-slate-700/50 flex justify-end items-center shrink-0">
                                            <span className="text-xs md:text-sm font-bold text-slate-200 bg-slate-800/80 px-3 md:px-4 py-1.5 md:py-2 rounded-full border border-slate-600/50 backdrop-blur-sm">Pts en ronda: <span className="text-cyan-400">+{currentTurnPoints}</span></span>
                                        </div>
                                    )}
                                    
                                    <div className="flex-1 min-h-0 flex flex-col p-2 md:p-4">
                                        {!isCricket ? (
                                            <div className={`grid gap-3 md:gap-4 w-full h-full ${getDynamicGridClass(players.length)}`}>
                                                {players.map((p, i) => (
                                                    <div key={p.id} className={`bg-slate-950/60 backdrop-blur-sm rounded-2xl border-4 flex flex-col items-center justify-center min-h-0 p-2 md:p-4 ${i === currentPlayerIdx ? 'border-cyan-500/80 shadow-[0_0_30px_rgba(6,182,212,0.3)] bg-cyan-900/20' : 'border-slate-700/50'}`}>
                                                        <span className={`text-lg md:text-2xl font-bold uppercase tracking-widest mb-1 md:mb-2 shrink-0 drop-shadow-md ${i === currentPlayerIdx ? 'text-cyan-400' : 'text-slate-400'}`}>
                                                            {p.name} {i === currentPlayerIdx && '(Tirando)'}
                                                        </span>
                                                        {gameMode === 'around_the_clock' && (
                                                            <span className="text-xs text-fuchsia-400 uppercase tracking-widest font-bold mb-[-10px] mt-2">Objetivo Actual</span>
                                                        )}
                                                        <span className={`text-5xl md:text-7xl lg:text-8xl font-black min-h-0 drop-shadow-lg ${i === currentPlayerIdx ? (gameMode === 'around_the_clock' ? 'text-fuchsia-400' : 'text-white') : 'text-slate-300'}`}>
                                                            {getLiveScore(p, i)}
                                                        </span>
                                                    </div>
                                                ))}
                                            </div>
                                        ) : (
                                            <table className="w-full h-full text-center border-collapse table-fixed">
                                                <thead>
                                                    <tr className="h-[12%]">
                                                        <th className="border-b-4 border-r-2 border-slate-700/80 text-slate-400 w-16 md:w-24 text-sm md:text-lg bg-slate-950/80 backdrop-blur-sm">Num</th>
                                                        {players.map((p, i) => <th key={p.id} className={`border-b-4 border-r-2 border-slate-700/80 ${i === currentPlayerIdx ? 'text-cyan-400 bg-cyan-900/40' : 'text-slate-200 bg-slate-950/80'} font-black text-[10px] sm:text-xs md:text-lg lg:text-xl truncate backdrop-blur-sm drop-shadow-md px-1`}>{p.name.substring(0,8)}</th>)}
                                                    </tr>
                                                </thead>
                                                <tbody className="h-[88%]">
                                                    {!isNoScore && (
                                                        <tr className="bg-slate-950/60 border-b-4 border-cyan-800/60 h-[11%]">
                                                            <td className="border-r-2 border-slate-700/80 font-black text-xs md:text-sm text-fuchsia-400 uppercase tracking-widest drop-shadow-md">PUNTOS</td>
                                                            {players.map((p, i) => <td key={`score-${p.id}`} className={`border-r-2 border-slate-700/80 font-black text-lg md:text-4xl text-white drop-shadow-lg ${i === currentPlayerIdx ? 'bg-cyan-900/30' : ''}`}>{p.score}</td>)}
                                                        </tr>
                                                    )}
                                                    {CRICKET_NUMBERS.map(num => (
                                                        <tr key={num} className="transition-colors h-[11%]">
                                                            <td className="border-t-2 border-r-2 border-slate-700/80 font-black text-xl md:text-3xl text-slate-200 bg-slate-950/40 drop-shadow-md">{num === 25 ? 'Bull' : num}</td>
                                                            {players.map((p, i) => <td key={`${p.id}-${num}`} className={`border-t-2 border-r-2 border-slate-700/80 relative ${i === currentPlayerIdx ? 'bg-cyan-900/30' : 'bg-slate-900/40'}`}>{renderCricketMark(p.marks[num])}</td>)}
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="w-full h-full flex flex-col text-white selection:bg-cyan-500 selection:text-white overflow-hidden relative bg-cover bg-center" style={{ backgroundImage: "url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=2071&auto=format&fit=crop')" }}>
                    <div className="absolute inset-0 bg-slate-950/70 z-0"></div>
                    
                    {/* Modal QR Único */}
                    {showQR && isOnline && roomId && !joinedViaUrl && (
                        <div className="absolute inset-0 z-50 bg-black/90 backdrop-blur-sm flex flex-col items-center justify-center p-4">
                            <div className="w-full max-w-lg flex flex-col items-center bg-slate-900 border border-slate-700 p-8 rounded-3xl shadow-2xl">
                                <h2 className="text-3xl md:text-4xl font-black text-white mb-2">SALA: <span className="text-fuchsia-400">{roomId}</span></h2>
                                <p className="text-slate-300 mb-6 font-bold text-center">Escanea este código con cualquier móvil para unirse a la partida como mando a distancia.</p>
                                <img src={`https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(generateSafeQRUrl())}`} alt="QR Sala" className="rounded-xl border-4 border-white w-full max-w-[250px] aspect-square shadow-[0_0_20px_rgba(255,255,255,0.2)] mb-8" />
                                <button onClick={() => setShowQR(false)} className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 rounded-xl transition-colors text-xl">Cerrar Código QR</button>
                            </div>
                        </div>
                    )}

                    {/* RUTEO PRINCIPAL */}
                    {joinedViaUrl ? (
                        (localPlayerId === null && !isAdminRemote) ? renderMobilePlayerSelect() : (appState === 'playing' ? renderGame() : renderMobileWaiting())
                    ) : (
                        <>
                            {appState === 'home' && renderHome()}
                            {appState === 'setup_config' && renderConfig()}
                            {appState === 'setup_names' && renderNames()}
                            {appState === 'setup_qr' && renderSetupQR()}
                            {appState === 'setup_rematch' && renderRematchConfig()}
                            {appState === 'playing' && renderGame()}
                            {appState === 'ranking' && renderRanking()}
                            {appState === 'profiles' && renderProfiles()}
                        </>
                    )}
                    
                    <div className="absolute bottom-1 md:bottom-2 right-2 md:right-4 text-cyan-300/60 font-mono text-[10px] md:text-xs font-bold tracking-widest z-50 pointer-events-none drop-shadow-md">
                        AVS 5
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
